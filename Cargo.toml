[package]
name = "paint_cp"
version = "1.3.0"
edition = "2021"
description = "Paint CP - app semplice per piccole modifiche alle foto in stile Paint"

[[bin]]
name = "paint_cp"
path = "main.rs"

[build-dependencies]
# Icona e risorse dell'eseguibile (usato solo quando si compila per Windows).
embed-resource = "2"

[dependencies]
eframe = "0.29"
# Controllo aggiornamenti: lettura dell'ultima release pubblicata su GitHub.
ureq = "2"
rfd = "0.15"
ab_glyph = "0.2"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

# Le dipendenze in debug sono lente: ottimizzale comunque.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
